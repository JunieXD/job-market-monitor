name: job-market-monitor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_market}
      POSTGRES_USER: ${POSTGRES_USER:-job_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-deploying}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build:
      context: .
    init: true
    shm_size: "1gb"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://job_market:change-me-before-deploying@postgres:5432/job_market}
      RAW_DATA_DIR: ${RAW_DATA_DIR:-/data/raw}
      BYTEDANCE_REQUEST_DELAY_SECONDS: ${BYTEDANCE_REQUEST_DELAY_SECONDS:-1.5}
      ALIBABA_REQUEST_DELAY_SECONDS: ${ALIBABA_REQUEST_DELAY_SECONDS:-1.5}
      TENCENT_REQUEST_DELAY_SECONDS: ${TENCENT_REQUEST_DELAY_SECONDS:-1.5}
      MEITUAN_REQUEST_DELAY_SECONDS: ${MEITUAN_REQUEST_DELAY_SECONDS:-1.5}
      JD_REQUEST_DELAY_SECONDS: ${JD_REQUEST_DELAY_SECONDS:-1.5}
      NETEASE_REQUEST_DELAY_SECONDS: ${NETEASE_REQUEST_DELAY_SECONDS:-1.5}
      XIAOMI_REQUEST_DELAY_SECONDS: ${XIAOMI_REQUEST_DELAY_SECONDS:-1.5}
      HUAWEI_REQUEST_DELAY_SECONDS: ${HUAWEI_REQUEST_DELAY_SECONDS:-1.5}
      KUAISHOU_REQUEST_DELAY_SECONDS: ${KUAISHOU_REQUEST_DELAY_SECONDS:-1.5}
      KUAISHOU_CAMPUS_REQUEST_DELAY_SECONDS: ${KUAISHOU_CAMPUS_REQUEST_DELAY_SECONDS:-1.5}
      BAIDU_REQUEST_DELAY_SECONDS: ${BAIDU_REQUEST_DELAY_SECONDS:-1.5}
      DIDI_REQUEST_DELAY_SECONDS: ${DIDI_REQUEST_DELAY_SECONDS:-1.5}
      BILIBILI_REQUEST_DELAY_SECONDS: ${BILIBILI_REQUEST_DELAY_SECONDS:-1.5}
      PDD_REQUEST_DELAY_SECONDS: ${PDD_REQUEST_DELAY_SECONDS:-1.5}
      ANT_REQUEST_DELAY_SECONDS: ${ANT_REQUEST_DELAY_SECONDS:-1.5}
      CTRIP_REQUEST_DELAY_SECONDS: ${CTRIP_REQUEST_DELAY_SECONDS:-1.5}
      QIHU360_REQUEST_DELAY_SECONDS: ${QIHU360_REQUEST_DELAY_SECONDS:-1.5}
      OPPO_REQUEST_DELAY_SECONDS: ${OPPO_REQUEST_DELAY_SECONDS:-1.5}
      VIVO_REQUEST_DELAY_SECONDS: ${VIVO_REQUEST_DELAY_SECONDS:-1.5}
      XIAOHONGSHU_REQUEST_DELAY_SECONDS: ${XIAOHONGSHU_REQUEST_DELAY_SECONDS:-1.5}
      IQIYI_REQUEST_DELAY_SECONDS: ${IQIYI_REQUEST_DELAY_SECONDS:-1.5}
      CAINIAO_REQUEST_DELAY_SECONDS: ${CAINIAO_REQUEST_DELAY_SECONDS:-1.5}
      ALIBABA_INTERNATIONAL_REQUEST_DELAY_SECONDS: ${ALIBABA_INTERNATIONAL_REQUEST_DELAY_SECONDS:-1.5}
      ALIYUN_REQUEST_DELAY_SECONDS: ${ALIYUN_REQUEST_DELAY_SECONDS:-1.5}
      BEIKE_REQUEST_DELAY_SECONDS: ${BEIKE_REQUEST_DELAY_SECONDS:-1.5}
      TONGCHENG_REQUEST_DELAY_SECONDS: ${TONGCHENG_REQUEST_DELAY_SECONDS:-1.5}
      LENOVO_REQUEST_DELAY_SECONDS: ${LENOVO_REQUEST_DELAY_SECONDS:-1.5}
      CRAWL_CHANNEL_TIMEOUT_SECONDS: ${CRAWL_CHANNEL_TIMEOUT_SECONDS:-2700}
      SOURCE_STALE_AFTER_HOURS: ${SOURCE_STALE_AFTER_HOURS:-36}
      ABANDONED_RUN_AFTER_MINUTES: ${ABANDONED_RUN_AFTER_MINUTES:-180}
      RAW_MIN_FREE_GIB: ${RAW_MIN_FREE_GIB:-5}
      MISSING_RUNS_BEFORE_CLOSE: ${MISSING_RUNS_BEFORE_CLOSE:-2}
      HEADLESS: ${HEADLESS:-true}
    volumes:
      - raw-data:/data/raw
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
    init: true
    entrypoint: ["uvicorn"]
    command:
      [
        "job_market.api.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://job_market:change-me-before-deploying@postgres:5432/job_market}
      SOURCE_STALE_AFTER_HOURS: ${SOURCE_STALE_AFTER_HOURS:-36}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  raw-data:
